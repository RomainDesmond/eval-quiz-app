services:
  frontend:
    #image: node:18-alpine
    container_name: eval-quizz-app_frontend_cont
    #restart : unless-stopped
    ports : 
      - 5173:5173
    build:
      dockerfile: Dockerfile
    networks:
      - eval-quizz-app_net
    #command: bash -c "while true; do echo hello; sleep 2; done"
  backend:
    #image: node:18-alpine
    container_name: eval-quizz-app_backend_cont
    restart : unless-stopped
    ports : 
      - 3007:3007
    build:
      dockerfile: ./backend/Dockerfile
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    #build:
    #  dockerfile: Dockerfile
    networks:
      - eval-quizz-app_net

  postgreSQL:
    image: postgres:16
    container_name: eval-quizz-app_postgres_cont
    restart : unless-stopped
    ports : 
      - 5432:5432
    #build:
    #  dockerfile: Dockerfile
    environment : 
      POSTGRES_PASSWORD: example #à changer et sécuriser, mdp temporaire
    volumes:
      - db_postgres_data_vol:/var/lib/postgresql/data
    networks:
      - eval-quizz-app_net
  #Resend:
   # image: quiz-docker:secure
    #container_name: eval-quizz-app_rescend_cont
    #restart : unless-stopped
    #ports : 
    # - 8082:5173
    #build:
    #  dockerfile: Dockerfile
    #environment:
    #  RESEND_API_KEY: ${RESEND_API_KEY}
    #network:
    #  -eval-quizz-app_net
networks:
  eval-quizz-app_net:
    driver: bridge
    name : eval-quizz-app_net
volumes:
  db_postgres_data_vol: