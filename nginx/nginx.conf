server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    # Main app
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin page - serve gestion-quiz.html for /gestion-quiz route
    location = /gestion-quiz {
        try_files /gestion-quiz.html =404;
    }

    # API proxy to backend with load balancing
    location /api/ {
        resolver 168.63.129.16 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $backend_target "https://backend.proudsky-24987c4e.austriaeast.azurecontainerapps.io";
        proxy_pass $backend_target;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host backend.proudsky-24987c4e.austriaeast.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
								 
							   
							   
    }

    # Health check endpoint
    location /health {
        resolver 168.63.129.16 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $backend_target "https://backend.proudsky-24987c4e.austriaeast.azurecontainerapps.io";
        proxy_pass $backend_target;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }
}